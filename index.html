<!DOCTYPE html>

<head>

<body>

  <div class="backdrop" aria-hidden="true"></div>
  <div class="backdrop-scrim" aria-hidden="true"></div>

  <main class="pass" role="main">

    <div class="pass__tab" aria-hidden="true">
      <span class="pass__grommet"></span>
    </div>

    <header class="pass__header">
      <span class="pass__eyebrow">Paddock Pass</span>
      <span class="pass__no">No. 00</span>
    </header>

    <div class="pass__id">
      <!-- EDIT ME: your name / character name -->
      <h1 class="pass__name">DemianLeivc</h1>
      <!-- EDIT ME: handle, verse, callsign — whatever fits -->
      <p class="pass__handle">@demianleivc16 · un GOSTAZOOO</p>
    </div>

    <div class="pass__rule" aria-hidden="true"></div>

    <!-- EDIT ME: this is your bio / blurb. Keep it to a few lines — -->
    <!-- the card is built for something you can read at a glance.   -->
    <p class="pass__bio">
      Boooooooooooenasssssssssssss soy yo Demian, salu2
    </p>

    <div class="pass__rule" aria-hidden="true"></div>

    <nav class="pass__links" aria-label="Social links">
      <!-- EDIT ME: change the href on each <a>, or duplicate an <a>
           block to add more. Swap the <svg> for any icon you like. -->

      <a class="pass__link" href="https://instagram.com/demianleivc16" target="_blank" rel="noopener">

      <!-- Discord has no public profile URL, so this copies your
           username instead of linking out. -->
      <button type="button" class="pass__link" data-copy="demianos">

      <a class="pass__link" href="mailto:demian.leivc@gmail.com">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1.4 2 7.1 6.1a1 1 0 0 0 1.3 0L20 7H4.4ZM4 8.4V17h16V8.4l-6.7 5.8a3 3 0 0 1-3.9 0L4 8.4Z"/></svg>
        <span>Email</span>
      </a>

    </nav>

  </main>

  <script>
    document.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(btn.dataset.copy);
          var label = btn.querySelector('span');
          var original = label.textContent;
          label.textContent = 'Copied!';
          btn.classList.add('is-copied');
          setTimeout(function () {
            label.textContent = original;
            btn.classList.remove('is-copied');
          }, 1400);
        } catch (err) {
          /* clipboard unavailable — username is still readable on the button */
        }
      });
    });
  </script>

</body>
</html>
